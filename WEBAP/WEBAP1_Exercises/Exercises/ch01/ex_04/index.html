<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 1.4</title>
    <link rel="stylesheet" href="../../../assets/exercise.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function()
        {
            $("#calc").click(function(){
           let a = parseInt($("#a").val());
           let b = parseInt($("#b").val());
           let op = $("#op").val();

           if(isNaN (a) || isNaN (b) ){
               $("#result").text("Invalid input").addClass("error");
           }
          else if (op === "/" && b === 0) {
                $("#result").text("Division by zero is not allowed").addClass("error");
            }
            else {
                
                 let result;
                if (op === "+") {
                    result = a + b;
                } else if (op === "-") {
                    result = a - b;
                } else if (op === "*") {
                    result = a * b;
                } else if (op === "/") {
                    result = a / b;
                }
                $("#result").text(result).removeClass("error");
            }
            });
           
        });
    </script>
</head>
<body>
    <h2>Exercise 1.4 – Calculator</h2>
    <p>
        <input type="number" id="a" placeholder="Number 1">
        <select id="op">
            <option value="+">+</option>
            <option value="-">−</option>
            <option value="*">×</option>
            <option value="/">÷</option>
        </select>
        <input type="number" id="b" placeholder="Number 2">
        <button id="calc">=</button>
        <span id="result" class="result"></span>
    </p>
</body>
</html>
