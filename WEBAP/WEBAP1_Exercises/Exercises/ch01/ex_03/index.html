<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 1.3</title>
    <link rel="stylesheet" href="../../../assets/exercise.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
     
     $(document).ready(function()

    {
        $("#greet").click(function(){
            let firstName = $("#firstName").val().trim();
            let lastName  = $("#lastName").val().trim();

            if (firstName == "" || lastName == "") {
                $("#message").text("Please fill in both fields!").addClass("error");
                if (firstName === "") {
                    $("#firstName").focus();
                } else {
                    $("#lastName").focus();
                }
            } else {
                $("#message").text("").removeClass("error");
                $("#output").text("Hello " + firstName + " " + lastName + "!");
                $("#firstName").val("");
                $("#lastName").val("");
            }
        });

       $("#lastName").keyup(function(e){
            if (e.key === "Enter") {
                $("#greet").click();
            }
        });
        });
    
    

    </script>
</head> 
<body>
    <h2>Exercise 1.3 – Greeting</h2>
    <p>
        <input type="text" id="firstName" placeholder="First name">
        <input type="text" id="lastName" placeholder="Last name">
        <button id="greet">Greet me</button>
    </p>
    <p id="message"></p>
    <div id="output" class="box"></div>
</body>
</html>
