<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 1.1</title>
    <link rel="stylesheet" href="../../../assets/exercise.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
      $(document).ready(function () {

    function clearAll() {
        $("#page, #page *").css("background-color", "");
    }

    function highlight(selector) {
        clearAll();                                   
        $(selector).css("background-color", "pink");
    }

    $("#b1").click(function () { highlight("p"); });
    $("#b2").click(function () { highlight("#left"); });
    $("#b3").click(function () { highlight("#left p"); });
    $("#b4").click(function () { highlight(".special"); });
    $("#b5").click(function () { highlight("p.special"); });
    $("#b6").click(function () { highlight("div#right p.special"); });
    $("#b7").click(function () { highlight("#page p"); });
    $("#b8").click(function () { highlight("#page > p"); });

    $("#reset").click(clearAll);
});

    </script>
</head>
<body>
    <h2>Exercise 1.1 – Selectors</h2>
    <div id="buttons">
        <button id="b1">$("p")</button>
        <button id="b2">$("#left")</button>
        <button id="b3">$("#left p")</button>
        <button id="b4">$(".special")</button>
        <button id="b5">$("p.special")</button>
        <button id="b6">$("div#right p.special")</button>
        <button id="b7">$("#page p")</button>
        <button id="b8">$("#page &gt; p")</button>
        <button id="reset">Reset</button>
    </div>

    <div id="page">
        <h1>Welcome</h1>
        <div id="left">
            <p>Paragraph A</p>
            <p class="special">Paragraph B</p>
        </div>
        <div id="right">
            <p class="special">Paragraph C</p>
            <p>Paragraph D</p>
        </div>
        <div class="special">
            <p>Paragraph E</p>
        </div>
    </div>
</body>
</html>
